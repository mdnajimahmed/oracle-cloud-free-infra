# cert-manager Certificate resource.
# cert-manager will obtain a Let's Encrypt certificate and store it in the
# Secret named "turinghatch-tls" which the Gateway references for TLS.
#
# IMPORTANT: Start with letsencrypt-staging to verify everything works.
# Then switch to letsencrypt-prod and delete the staging secret to re-issue.
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: turinghatch-tls
  namespace: turinghatch
spec:
  secretName: turinghatch-tls
  issuerRef:
    name: letsencrypt-staging   # Switch to letsencrypt-prod once tested
    kind: ClusterIssuer
  dnsNames:
    - turinghatch.com
    - www.turinghatch.com
    - api.turinghatch.com
