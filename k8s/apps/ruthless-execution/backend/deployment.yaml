apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: ruthless-execution
spec:
  replicas: 1
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      imagePullSecrets:
        - name: dockerhub-secret
      enableServiceLinks: false
      containers:
        - name: backend
          image: ivplay4689/turinghatch:ruthless-execution-be-1.0.0
          ports:
            - containerPort: 9559
          envFrom:
            - secretRef:
                name: ruthless-execution-be-secret
            - configMapRef:
                name: ruthless-execution-be-config
          resources:
            requests:
              memory: "256Mi"
              cpu: "200m"
            limits:
              memory: "512Mi"
              cpu: "1000m"
          readinessProbe:
            tcpSocket:
              port: 9559
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9559
            initialDelaySeconds: 20
            periodSeconds: 20
