# Route turinghatch.com and www.turinghatch.com → React frontend
# Also adds HTTP→HTTPS redirect on port 80
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-redirect-http
  namespace: ruthless-execution
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: http
  hostnames:
    - "turinghatch.com"
    - "www.turinghatch.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 301
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route
  namespace: ruthless-execution
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https-apex
  hostnames:
    - "turinghatch.com"
  rules:
    - matches:
        - path:
            type: Exact
            value: /ruthless-execution
      filters:
        - type: RequestRedirect
          requestRedirect:
            path:
              type: ReplaceFullPath
              replaceFullPath: /ruthless-execution/
            statusCode: 301
    - matches:
        - path:
            type: PathPrefix
            value: /ruthless-execution/
      backendRefs:
        - name: frontend-svc
          port: 80
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: frontend-route-www
  namespace: ruthless-execution
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https
  hostnames:
    - "www.turinghatch.com"
  rules:
    - filters:
        - type: RequestRedirect
          requestRedirect:
            hostname: turinghatch.com
            statusCode: 301
