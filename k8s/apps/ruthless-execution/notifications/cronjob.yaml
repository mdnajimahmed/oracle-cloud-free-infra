apiVersion: batch/v1
kind: CronJob
metadata:
  name: goal-notifications
  namespace: ruthless-execution
  labels:
    app: goal-notifications
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 55
      template:
        metadata:
          labels:
            app: goal-notifications
        spec:
          restartPolicy: Never
          imagePullSecrets:
            - name: dockerhub-secret
          enableServiceLinks: false
          containers:
            - name: goal-notifications
              image: ivplay4689/turinghatch:ruthless-execution-be-1.0.0
              command: ["node", "dist/scripts/send-notifications.js"]
              envFrom:
                - secretRef:
                    name: ruthless-execution-be-secret
                - configMapRef:
                    name: ruthless-execution-be-config
              resources:
                requests:
                  cpu: "50m"
                  memory: "128Mi"
                limits:
                  cpu: "200m"
                  memory: "256Mi"
