# Route turinghatch.com/ruthless-execution/api/* → backend service, stripping /ruthless-execution prefix
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: backend-route
  namespace: ruthless-execution
spec:
  parentRefs:
    - name: main-gateway
      namespace: envoy-gateway-system
      sectionName: https-apex
  hostnames:
    - "turinghatch.com"
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /ruthless-execution/api
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /api
      backendRefs:
        - name: backend-svc
          port: 80
