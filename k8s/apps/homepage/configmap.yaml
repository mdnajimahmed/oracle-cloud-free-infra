apiVersion: v1
kind: ConfigMap
metadata:
  name: homepage-html
  namespace: turinghatch
data:
  index.html: |
    <!DOCTYPE html>
    <html lang="en">
    <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>turinghatch</title>
      <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
          font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
          background: #f0faf9;
          color: #134e4a;
          min-height: 100vh;
          display: flex;
          flex-direction: column;
        }
        header {
          background: #0f766e;
          padding: 2.5rem 2rem;
          text-align: center;
          box-shadow: 0 2px 8px rgba(0,0,0,0.12);
        }
        header h1 {
          color: #fff;
          font-size: 2rem;
          font-weight: 700;
          letter-spacing: 0.04em;
        }
        header p {
          color: #99f6e4;
          margin-top: 0.4rem;
          font-size: 0.95rem;
        }
        main {
          flex: 1;
          max-width: 720px;
          margin: 3rem auto;
          padding: 0 1.5rem;
          width: 100%;
        }
        .section-label {
          font-size: 0.72rem;
          font-weight: 600;
          text-transform: uppercase;
          letter-spacing: 0.12em;
          color: #0d9488;
          margin-bottom: 1rem;
        }
        .app-list {
          display: flex;
          flex-direction: column;
          gap: 0.75rem;
        }
        .app-card {
          display: flex;
          align-items: center;
          justify-content: space-between;
          background: #fff;
          border: 1px solid #ccfbf1;
          border-left: 4px solid #14b8a6;
          border-radius: 10px;
          padding: 1.25rem 1.5rem;
          text-decoration: none;
          color: inherit;
          transition: transform 0.1s, box-shadow 0.1s;
        }
        .app-card:hover {
          transform: translateY(-1px);
          box-shadow: 0 6px 20px rgba(20,184,166,0.15);
        }
        .app-name {
          font-size: 1rem;
          font-weight: 600;
          color: #0f766e;
        }
        .app-desc {
          font-size: 0.875rem;
          color: #5f9ea0;
          margin-top: 0.25rem;
        }
        .arrow {
          color: #14b8a6;
          font-size: 1.25rem;
        }
        footer {
          text-align: center;
          padding: 1.5rem;
          font-size: 0.78rem;
          color: #9ca3af;
        }
      </style>
    </head>
    <body>
      <header>
        <h1>turinghatch</h1>
        <p>Your personal productivity platform</p>
      </header>
      <main>
        <p class="section-label">Apps</p>
        <div class="app-list">
          <a class="app-card" href="/ruthless-execution">
            <div>
              <div class="app-name">ruthless-execution</div>
              <div class="app-desc">Build daily consistency and routines</div>
            </div>
            <span class="arrow">&#8594;</span>
          </a>
        </div>
      </main>
      <footer>&copy; 2026 turinghatch</footer>
    </body>
    </html>
